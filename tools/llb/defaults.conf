# llb defaults (sh syntax, read by tools/llb/llb). Per-model settings live in models.conf.
# Max tokens to generate when -n is not given.
LLB_DEFAULT_N=256
# Prompt prefill tier: exact (token by token, the q27c engine) or fast (LLB_PREFILL=fast, int8 tensor cores).
# Fast since UNIFY1's PF28 kill gate passed (R2, reports/unify1-gates.md, e9e66ffe); --exact per run, or exact here.
# Re-judged 2026-10-16 under Verdict Gates v2 (PREFILL-27B, canonical engine 2e1f7a7a): PASS, industry-class floor; docs/reference/decide-configuration.md.
LLB_DEFAULT_PREFILL=fast
# Where models are searched (after $LLB_MODELS): colon-separated.
LLB_SEARCH="$HOME/models:.:$HOME/.cache/huggingface/hub"
