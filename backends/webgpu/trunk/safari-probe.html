<!doctype html>
<html><head><meta charset="utf-8"><title>probe: starting</title></head><body>
<iframe id="f" src="clef.html?keep=1" style="width:100%;height:90vh;border:0"></iframe>
<script>
// safari-probe.html (TRUNK-DEMO): real Safari.app without WebDriver/Apple Events. Mirrors clef.html's status into this title
// (readable from CGWindowList even with the screen locked), runs one clefDecide once the demo is DONE, and beacons each step
// to ?to=<collector url> (text/plain, no-cors). Not linked from anywhere; clef.html itself is unchanged.
const to = new URLSearchParams(location.search).get("to"), f = document.getElementById("f"), t0 = performance.now();
const beacon = (o) => { if (to) fetch(to, { method: "POST", mode: "no-cors", body: JSON.stringify({ t_s: +((performance.now() - t0) / 1000).toFixed(1), ua: navigator.userAgent, vis: document.visibilityState, ...o }) }).catch(() => {}); };
const DEC = { state: "The customer wrote: the screen cracked on day two and I'd like a replacement, not a refund.",
  questions: { refund: { type: "noul", instructions: "Does the customer ask for a refund?" },
    want: { type: "choice", instructions: "What does the customer want?", criteria: { replacement: "a new unit", refund: "money back", repair: "fix it" } } } };
let done = false;
const tick = setInterval(async () => {
  const w = f.contentWindow, st = w?.document?.getElementById("st")?.textContent ?? "(no frame)";
  if (!done) { document.title = "probe: " + st.slice(0, 80); beacon({ st, errors: w?.__smoke?.errors ?? null }); }
  if (!done && w?.document?.title === "DONE") {
    done = true; clearInterval(tick);
    try { const t = performance.now(), r = await w.clefDecide(DEC), ms = Math.round(performance.now() - t);
      document.title = `probe: DECIDED refund=${r.answers.refund.noul.toFixed(4)} want=${r.answers.want.choice} ${ms}ms errors=${w.__smoke.errors.length}`;
      beacon({ final: true, demo: w.document.getElementById("out").textContent, open: w.__smoke.result?.open, decide: { ms, answers: r.answers, usage: r.usage, stats: r.stats }, errors: w.__smoke.errors });
    } catch (e) { document.title = "probe: DECIDE ERROR " + e.message; beacon({ final: true, error: String(e.stack ?? e), errors: w.__smoke?.errors }); }
    setTimeout(() => { f.src = "about:blank"; }, 3000);   // drop the 5.9 GB engine once reported
  }
}, 2000);
</script></body></html>
