<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ears · Eureka senses</title><link rel="icon" href="data:,"><link rel="stylesheet" href="common.css">
<body data-page="ears">
<main><section class="card">
  <div class="row"><select id="model"><option value="onnx-community/whisper-base.en">whisper-base.en (74M, default)</option><option value="onnx-community/whisper-tiny.en">whisper-tiny.en (39M)</option></select>
    <button class="pri" id="mic" disabled>Hold to talk</button><button id="sample" disabled>Sample (say, 5.4 s)</button><button id="bella" disabled>Kokoro's voice (round trip)</button>
    <label><input type="file" id="file" accept="audio/*" hidden><span class="chip" style="cursor:pointer" onclick="file.click()">Audio file…</span></label></div>
  <p class="status" id="status"></p><h2 style="font-size:13px;color:var(--dim)">TRANSCRIPT</h2><div class="out" id="out"></div><p class="note" id="expect"></p></section>
<aside class="card"><h2>Measured</h2><div class="stats" id="stats"></div><h2 style="margin-top:14px">Log</h2><div class="log" id="log"></div>
<p class="note">Whisper (ONNX) through transformers.js. WebGPU = fp32 encoder + q4 decoder on ORT's WebGPU EP; WASM = int8 on CPU. Audio never leaves the tab. If neither path can load, this page says so. It does not fall back to a server.</p></aside></main>
<script type="module">
import T from "./tjs.js";
import { q, S, pickEP, shell, ran, log, status, stats, fail, now, ms, decodeTo } from "./common.js";
shell("Ears", "Whisper ASR, in this tab");
const $ = (i) => document.getElementById(i); let asr, ep, rec, chunks = [];
const norm = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
function wer(ref, hyp) { const r = norm(ref), h = norm(hyp), d = Array.from({ length: r.length + 1 }, (_, i) => [i, ...Array(h.length).fill(0)]);
  for (let j = 1; j <= h.length; j++) d[0][j] = j;
  for (let i = 1; i <= r.length; i++) for (let j = 1; j <= h.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (r[i - 1] === h[j - 1] ? 0 : 1));
  return +(d[r.length][h.length] / r.length).toFixed(3); }
async function load(id) {
  status(`loading ${id.split("/")[1]}…`); const t0 = now();
  asr = await T.pipeline("automatic-speech-recognition", id, { device: ep, dtype: ep === "webgpu" ? { encoder_model: "fp32", decoder_model_merged: "q4" } : { encoder_model: "q8", decoder_model_merged: "q8" } });
  S.t.load_ms = now() - t0; S.model = id; log(`${id} on ${ep}: load ${ms(S.t.load_ms)}`); ran(ep); status("ready · hold the button and talk, or try a sample", "ok");
}
async function hear(pcm, label, expect) {
  const t0 = now(); const r = await asr(pcm); const dt = now() - t0, dur = pcm.length / 16000;
  const run = { src: label, model: S.model.split("/")[1], audio_s: +dur.toFixed(2), transcribe_ms: Math.round(dt), rtf: +(dt / 1000 / dur).toFixed(3), text: r.text.trim() };
  if (expect) { run.wer = wer(expect, r.text); $("expect").textContent = `expected: “${expect}” · WER ${run.wer}`; } else $("expect").textContent = "";
  (S.runs ??= []).push(run); $("out").textContent = run.text;
  stats({ path: ep === "webgpu" ? "WebGPU (enc fp32 / dec q4)" : "WASM (CPU, q8)", model: run.model, load: ms(S.t.load_ms), "first transcript": ms(S.runs[0].transcribe_ms), "this transcript": ms(dt), audio: dur.toFixed(2) + " s", "real-time factor": run.rtf, ...(run.wer != null ? { WER: run.wer } : {}) });
  log(`${label}: ${dur.toFixed(2)} s → ${ms(dt)} “${run.text}”`); status(`heard ${dur.toFixed(1)} s in ${ms(dt)}`, "ok"); return run;
}
const fromUrl = async (u) => decodeTo(16000, await (await fetch(u)).arrayBuffer());
const SAMPLE = (await (await fetch("assets/speech-sample.txt")).text()).trim();
const BELLA = "Hi, I'm Bella. Everything you hear right now was synthesized inside this browser tab, with no server at all.";
try {
  ep = await pickEP(); await load(q.get("model") ?? $("model").value); $("model").value = S.model;
  for (const b of ["mic", "sample", "bella"]) $(b).disabled = false;
  $("model").onchange = (e) => load(e.target.value).catch((x) => fail("load", x));
  $("sample").onclick = async () => hear(await fromUrl("assets/speech-sample.wav"), "sample", SAMPLE);
  $("bella").onclick = async () => hear(await fromUrl("assets/kokoro-bella.wav"), "kokoro af_bella", BELLA);
  $("file").onchange = async (e) => hear(await decodeTo(16000, await e.target.files[0].arrayBuffer()), e.target.files[0].name);
  const start = async () => { try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); chunks = []; rec = new MediaRecorder(st);
      rec.ondataavailable = (e) => chunks.push(e.data); rec.onstop = async () => { st.getTracks().forEach((t) => t.stop()); hear(await decodeTo(16000, await new Blob(chunks).arrayBuffer()), "mic").catch((x) => fail("mic", x)); };
      rec.start(); status("listening… release to transcribe"); } catch (x) { fail("microphone", x); } };
  const stop = () => rec?.state === "recording" && rec.stop();
  $("mic").onpointerdown = start; $("mic").onpointerup = stop; $("mic").onpointerleave = stop;
  if (!q.has("idle")) { await hear(await fromUrl("assets/speech-sample.wav"), "sample", SAMPLE); await hear(await fromUrl("assets/speech-sample.wav"), "sample (warm)", SAMPLE); await hear(await fromUrl("assets/kokoro-bella.wav"), "kokoro af_bella", BELLA); }
  S.status = "ok";
} catch (e) { fail("ears", e); status(`In-page ASR could not start (${e?.message ?? e}). Voice input is not available in this tab; no server is configured for it.`, "err"); }
</script></body></html>
