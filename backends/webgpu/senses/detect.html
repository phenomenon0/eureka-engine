<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detect · Eureka senses</title><link rel="icon" href="data:,"><link rel="stylesheet" href="common.css">
<style>#stage{position:relative;display:inline-block;max-width:100%}#stage img,#stage video,#ov{display:block;max-width:100%;max-height:70vh;border-radius:8px}#ov{position:absolute;inset:0;width:100%;height:100%}#stage video{display:none}
#fps{position:absolute;left:8px;top:8px;background:#000a;padding:3px 8px;border-radius:6px;font:12px ui-monospace,Menlo,monospace}</style>
<body data-page="detect">
<main><section class="card"><div class="row">
  <button data-img="assets/bus.jpg">bus.jpg</button><button data-img="assets/zidane.jpg">zidane.jpg</button>
  <label><input type="file" id="file" accept="image/*" hidden><span class="chip" style="cursor:pointer" onclick="file.click()">Your image…</span></label>
  <button id="cam">Camera</button><button id="bench">Bench 60 frames</button>
  <select id="model"><option value="dfine_n">D-FINE-n (15 MB)</option><option value="dfine_s">D-FINE-s (40 MB)</option></select>
  <label class="note">score ≥ <input id="thr" type="number" min="0.1" max="0.95" step="0.05" value="0.5" style="width:60px"></label></div>
  <div id="stage"><img id="img" alt="input" crossorigin="anonymous"><video id="vid" playsinline muted></video><canvas id="ov"></canvas><span id="fps">–</span></div>
  <p class="status" id="status"></p></section>
<aside class="card"><h2>Measured</h2><div class="stats" id="stats"></div><h2 style="margin-top:14px">Detections</h2><div class="log" id="dets"></div><h2 style="margin-top:14px">Log</h2><div class="log" id="log"></div>
<p class="note">D-FINE (COCO-80) as ONNX through onnxruntime-web; WebGPU path = ORT's WebGPU EP (its WGSL is generated by ORT, not bend's emitter). Infer = <code>session.run</code> only; fps = whole frame (pre + infer + boxes).</p></aside></main>
<script type="module">
import * as ort from "./vendor/ort/ort.webgpu.min.mjs";
import { DETECT, HF } from "./hosts.js";
if (HF) document.querySelector('#model option[value="dfine_s"]').remove();   // D-FINE-s has no HF home: the box offers -n only
import { q, S, pickEP, shell, ran, log, status, stats, fail, now, ms, med } from "./common.js";
shell("Detect", "boxes, in this tab");
ort.env.wasm.wasmPaths = new URL("vendor/ort/", location.href).href; ort.env.logLevel = "error";
const SZ = 640, $ = (i) => document.getElementById(i), img = $("img"), vid = $("vid"), ov = $("ov"), ctx = ov.getContext("2d");
const cv = new OffscreenCanvas(SZ, SZ), cx = cv.getContext("2d", { willReadFrequently: true });
const ref = await (await fetch("assets/dfine_n_ref.json")).json(), NAMES = ref.names;
let sess = null, ep, running = false, src = img;
const win = { pre: [], inf: [], post: [], frame: [] };
const push = (k, v) => { win[k].push(v); if (win[k].length > 30) win[k].shift(); };

async function load(name) {
  const t0 = now();
  sess = await ort.InferenceSession.create(name === "dfine_n" ? DETECT : new URL(`../models/det-web/${name}.onnx`, location.href).href, { executionProviders: [ep], graphOptimizationLevel: q.get("opt") ?? "all", logSeverityLevel: 3 });
  S.t.load_ms = now() - t0; S.model = name; log(`${name} on ${ep}: load ${ms(S.t.load_ms)} · in ${sess.inputNames} · out ${sess.outputNames}`);
}
function pre(el) {
  cx.drawImage(el, 0, 0, SZ, SZ);
  const d = cx.getImageData(0, 0, SZ, SZ).data, x = new Float32Array(3 * SZ * SZ), P = SZ * SZ;
  for (let i = 0; i < P; i++) { x[i] = d[4 * i] / 255; x[P + i] = d[4 * i + 1] / 255; x[2 * P + i] = d[4 * i + 2] / 255; }
  return new ort.Tensor("float32", x, [1, 3, SZ, SZ]);
}
function post(lg, bx, W, H, thr) {
  const L = lg.data, B = bx.data, nc = lg.dims[2], out = [];
  for (let i = 0; i < L.length; i++) { const s = 1 / (1 + Math.exp(-L[i])); if (s >= thr) out.push([i, s]); }
  out.sort((a, b) => b[1] - a[1]);
  return out.slice(0, 100).map(([i, s]) => { const qq = (i / nc) | 0, c = i % nc, b = B.subarray(4 * qq, 4 * qq + 4);
    return { cls: NAMES[c], c, score: +s.toFixed(4), xyxy: [(b[0] - b[2] / 2) * W, (b[1] - b[3] / 2) * H, (b[0] + b[2] / 2) * W, (b[1] + b[3] / 2) * H].map((v) => +v.toFixed(1)) }; });
}
function draw(dets, W, H) {
  ov.width = W; ov.height = H; ctx.clearRect(0, 0, W, H); const lw = Math.max(2, W / 400);
  ctx.font = `${Math.max(12, W / 55)}px -apple-system,system-ui,sans-serif`; ctx.lineWidth = lw;
  for (const d of dets) { const [a, b, c, e] = d.xyxy, col = `hsl(${(d.c * 47) % 360} 80% 60%)`, t = `${d.cls} ${(d.score * 100).toFixed(0)}%`;
    ctx.strokeStyle = col; ctx.strokeRect(a, b, c - a, e - b); const tw = ctx.measureText(t).width + 8, th = parseInt(ctx.font) + 6;
    ctx.fillStyle = col; ctx.fillRect(a - lw / 2, Math.max(0, b - th), tw, th); ctx.fillStyle = "#000"; ctx.fillText(t, a + 4, Math.max(th - 6, b - 6)); }
}
async function frame(el) {
  const W = el.videoWidth || el.naturalWidth, H = el.videoHeight || el.naturalHeight, f0 = now();
  const x = pre(el), t1 = now(), o = await sess.run({ [sess.inputNames[0]]: x }), t2 = now();
  const lg = o[sess.outputNames[0]], bx = o[sess.outputNames[1]], dets = post(lg, bx, W, H, +$("thr").value); draw(dets, W, H); const t3 = now();
  push("pre", t1 - f0); push("inf", t2 - t1); push("post", t3 - t2); push("frame", t3 - f0);
  const fps = 1000 / med(win.frame);
  $("fps").textContent = `${fps.toFixed(1)} fps · infer ${ms(med(win.inf))} · ${ep === "webgpu" ? "WebGPU" : "WASM"}`;
  stats({ path: ep === "webgpu" ? "WebGPU (ORT EP)" : `WASM (CPU, ${ort.env.wasm.numThreads ?? "?"} thr)`, model: S.model, load: ms(S.t.load_ms),
    "infer (med 30)": ms(med(win.inf)), "pre (med)": ms(med(win.pre)), "boxes+draw (med)": ms(med(win.post)), "frame (med)": ms(med(win.frame)), fps: fps.toFixed(1), boxes: dets.length });
  $("dets").textContent = dets.map((d) => `${d.cls.padEnd(14)} ${d.score.toFixed(3)}  [${d.xyxy.map((v) => Math.round(v)).join(", ")}]`).join("\n");
  S.last = { dets, infer_ms: t2 - t1, frame_ms: t3 - f0 }; S.fps = fps; S.infer_med_ms = med(win.inf); S.frame_med_ms = med(win.frame);
  return dets;
}
const iou = (a, b) => { const w = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), h = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1])), i = w * h;
  return i / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - i); };
function parity(name, dets) {
  const r = ref.dets[name]; if (!r || S.model !== "dfine_n" || +$("thr").value !== 0.5) return null;
  const used = new Set(); let matched = 0, maxds = 0, minIou = 1;
  for (const a of r) { let best = -1, bi = 0; dets.forEach((d, j) => { if (!used.has(j) && d.cls === a.cls) { const v = iou(a.xyxy, d.xyxy); if (v > bi) { bi = v; best = j; } } });
    if (best >= 0 && bi > 0.85) { used.add(best); matched++; maxds = Math.max(maxds, Math.abs(dets[best].score - a.score)); minIou = Math.min(minIou, bi); } }
  return { image: name, ref: r.length, got: dets.length, matched, min_iou: +minIou.toFixed(3), max_score_diff: +maxds.toFixed(4), pass: matched === r.length && dets.length === r.length };
}
async function still(url) {
  running = false; vid.style.display = "none"; img.style.display = "block"; src = img;
  img.src = url; await img.decode(); const dets = await frame(img); const name = url.split("/").pop();
  const p = parity(name, dets); if (p) { (S.parity ??= {})[name] = p; log(`parity vs ORT-CPU fp32 ref (${name}): ${p.matched}/${p.ref} matched, min IoU ${p.min_iou}, max |Δscore| ${p.max_score_diff} → ${p.pass ? "PASS" : "FAIL"}`); }
  return dets;
}
async function bench(n = 60) {
  for (const k in win) win[k].length = 0; const t0 = now();
  for (let i = 0; i < n; i++) await frame(src);
  S.bench = { frames: n, wall_ms: Math.round(now() - t0), infer_med_ms: +med(win.inf).toFixed(2), frame_med_ms: +med(win.frame).toFixed(2), fps_med: +(1000 / med(win.frame)).toFixed(1), fps_wall: +(n / ((now() - t0) / 1000)).toFixed(1) };
  log(`bench ${n}: infer med ${ms(S.bench.infer_med_ms)} · frame med ${ms(S.bench.frame_med_ms)} · ${S.bench.fps_wall} fps wall`);
}
async function camera() {
  try { const st = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }); vid.srcObject = st; await vid.play(); }
  catch (e) { return fail("camera", e); }
  img.style.display = "none"; vid.style.display = "block"; src = vid; running = true; S.camera = true;
  const loop = async () => { if (!running) return; await frame(vid); requestAnimationFrame(loop); }; loop();
}
try {
  ep = await pickEP(); ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(8, navigator.hardwareConcurrency) : 1;
  status("loading detector…"); await load(q.get("model") ?? "dfine_n"); $("model").value = S.model; ran(ep);
  document.querySelectorAll("[data-img]").forEach((b) => (b.onclick = () => still(b.dataset.img)));
  $("file").onchange = (e) => e.target.files[0] && still(URL.createObjectURL(e.target.files[0]));
  $("cam").onclick = camera; $("bench").onclick = () => bench();
  $("model").onchange = async (e) => { running = false; await load(e.target.value); await still(src === vid ? "assets/bus.jpg" : img.src); };
  await still("assets/zidane.jpg"); await still(q.get("img") ?? "assets/bus.jpg");
  if (q.has("bench")) await bench(+q.get("bench") || 60);
  if (q.has("cam")) { await camera(); await new Promise((r) => setTimeout(r, 2500)); }
  S.status = "ok"; status(`ready · ${S.last.dets.length} boxes · ${ms(S.infer_med_ms)} per inference on ${ep === "webgpu" ? "WebGPU" : "WASM (CPU)"}`, "ok");
} catch (e) { fail("detect", e); }
</script></body></html>
